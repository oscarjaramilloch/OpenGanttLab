<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',Arial,sans-serif">
<title id="t">Tipos de dependencia</title><desc id="d">FC, CC, FF y CF entre una tarea A (predecesora) y una tarea B (sucesora).</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5a6b78"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#2563eb"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d0d0d0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="1.4"/></pattern>
</defs>
<rect x=".5" y=".5" width="939" height="399" rx="14" fill="#fff" stroke="#dde5ee"/>
<text x="470" text-anchor="middle" font-size="17" font-weight="700" fill="#0f2d5b"><tspan x="470" y="38.0">Los cuatro tipos de vínculo (formato de Project)</tspan></text>
<rect x="30" y="54" width="420" height="150" rx="12" fill="#f8fafc" stroke="#dde5ee"/><text x="46" text-anchor="start" font-size="14" font-weight="700" fill="#0f2d5b"><tspan x="46" y="84.9">FC  ·  Fin a Comienzo (FS)</tspan></text><text x="46" text-anchor="start" font-size="11.5" font-weight="500" fill="#5a6b78"><tspan x="46" y="104.0">B empieza cuando termina A. Es el tipo por defecto.</tspan></text><rect x="80" y="121" width="150" height="18" rx="4" fill="#2563eb"/><text x="50" text-anchor="middle" font-size="12" font-weight="700" fill="#0f2d5b"><tspan x="50" y="134.2">A</tspan></text><rect x="260" y="161" width="150" height="18" rx="4" fill="#16a34a"/><text x="230" text-anchor="middle" font-size="12" font-weight="700" fill="#0f5132"><tspan x="230" y="174.2">B</tspan></text><path d="M230 130 h12 V170 H260" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
<rect x="490" y="54" width="420" height="150" rx="12" fill="#f8fafc" stroke="#dde5ee"/><text x="506" text-anchor="start" font-size="14" font-weight="700" fill="#0f2d5b"><tspan x="506" y="84.9">CC  ·  Comienzo a Comienzo (SS)</tspan></text><text x="506" text-anchor="start" font-size="11.5" font-weight="500" fill="#5a6b78"><tspan x="506" y="104.0">B empieza cuando empieza A.</tspan></text><rect x="580" y="121" width="220" height="18" rx="4" fill="#2563eb"/><text x="550" text-anchor="middle" font-size="12" font-weight="700" fill="#0f2d5b"><tspan x="550" y="134.2">A</tspan></text><rect x="580" y="161" width="150" height="18" rx="4" fill="#16a34a"/><text x="550" text-anchor="middle" font-size="12" font-weight="700" fill="#0f5132"><tspan x="550" y="174.2">B</tspan></text><path d="M580 130 h-14 V170 H578" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
<rect x="30" y="224" width="420" height="150" rx="12" fill="#f8fafc" stroke="#dde5ee"/><text x="46" text-anchor="start" font-size="14" font-weight="700" fill="#0f2d5b"><tspan x="46" y="254.9">FF  ·  Fin a Fin (FF)</tspan></text><text x="46" text-anchor="start" font-size="11.5" font-weight="500" fill="#5a6b78"><tspan x="46" y="274.0">B termina cuando termina A.</tspan></text><rect x="80" y="291" width="220" height="18" rx="4" fill="#2563eb"/><text x="50" text-anchor="middle" font-size="12" font-weight="700" fill="#0f2d5b"><tspan x="50" y="304.2">A</tspan></text><rect x="160" y="331" width="140" height="18" rx="4" fill="#16a34a"/><text x="130" text-anchor="middle" font-size="12" font-weight="700" fill="#0f5132"><tspan x="130" y="344.2">B</tspan></text><path d="M300 300 h14 V340 H302" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
<rect x="490" y="224" width="420" height="150" rx="12" fill="#f8fafc" stroke="#dde5ee"/><text x="506" text-anchor="start" font-size="14" font-weight="700" fill="#0f2d5b"><tspan x="506" y="254.9">CF  ·  Comienzo a Fin (SF)</tspan></text><text x="506" text-anchor="start" font-size="11.5" font-weight="500" fill="#5a6b78"><tspan x="506" y="274.0">B termina cuando empieza A.</tspan></text><rect x="720" y="291" width="150" height="18" rx="4" fill="#2563eb"/><text x="690" text-anchor="middle" font-size="12" font-weight="700" fill="#0f2d5b"><tspan x="690" y="304.2">A</tspan></text><rect x="540" y="331" width="140" height="18" rx="4" fill="#16a34a"/><text x="510" text-anchor="middle" font-size="12" font-weight="700" fill="#0f5132"><tspan x="510" y="344.2">B</tspan></text><path d="M720 300 h-14 V340 H682" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
</svg>
