<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',Arial,sans-serif">
<title id="t">Qué conserva Compartir</title><desc id="d">Lo que se conserva en el archivo compartido y lo que hay que volver a configurar en el Gantt.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5a6b78"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#2563eb"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d0d0d0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="1.4"/></pattern>
</defs>
<rect x=".5" y=".5" width="939" height="361" rx="14" fill="#fff" stroke="#dde5ee"/>
<text x="470" text-anchor="middle" font-size="17" font-weight="700" fill="#0f2d5b"><tspan x="470" y="38.0">Qué viaja en el archivo compartido</tspan></text> <rect x="24" y="60" width="430" height="250" rx="12" fill="#f3fbf6" stroke="#16a34a" stroke-width="1.5"/><text x="239" text-anchor="middle" font-size="14" font-weight="600" fill="#172b3a"><tspan x="239" y="189.9"></tspan></text> <text x="44" text-anchor="start" font-size="12" font-weight="800" fill="#16a34a"><tspan x="44" y="90.2">SE CONSERVA</tspan></text> <circle cx="44" cy="112" r="4" fill="#16a34a"/><text x="58" text-anchor="start" font-size="12.5" font-weight="500" fill="#172b3a"><tspan x="58" y="120.4">Tareas: fechas, avance, marca de ruta crítica, ID y predecesoras</tspan></text> <circle cx="44" cy="142" r="4" fill="#16a34a"/><text x="58" text-anchor="start" font-size="12.5" font-weight="500" fill="#172b3a"><tspan x="58" y="150.4">Escenarios (Categorías 1) activos y sus colores</tspan></text> <circle cx="44" cy="172" r="4" fill="#16a34a"/><text x="58" text-anchor="start" font-size="12.5" font-weight="500" fill="#172b3a"><tspan x="58" y="180.4">Gantt: capas Línea base, Dependencias, Fechas y Resumen</tspan></text> <circle cx="44" cy="202" r="4" fill="#16a34a"/><text x="58" text-anchor="start" font-size="12.5" font-weight="500" fill="#172b3a"><tspan x="58" y="210.4">Gantt: escala, fuente, tamaños, orden y textos libres</tspan></text> <circle cx="44" cy="232" r="4" fill="#16a34a"/><text x="58" text-anchor="start" font-size="12.5" font-weight="500" fill="#172b3a"><tspan x="58" y="240.4">Línea de Tiempo completa: capas y modos, tareas ocultas,</tspan></text> <circle style="display:none" cx="44" cy="262" r="4" fill="none"/><text x="58" text-anchor="start" font-size="12.5" font-weight="500" fill="#172b3a"><tspan x="58" y="270.4">colores, textos, formas, títulos y formato de fecha</tspan></text> <rect x="486" y="60" width="430" height="250" rx="12" fill="#fff8ee" stroke="#f59e0b" stroke-width="1.5"/><text x="701" text-anchor="middle" font-size="14" font-weight="600" fill="#172b3a"><tspan x="701" y="189.9"></tspan></text> <text x="506" text-anchor="start" font-size="12" font-weight="800" fill="#b45309"><tspan x="506" y="90.2">HAY QUE VOLVER A CONFIGURARLO</tspan></text> <circle cx="506" cy="112" r="4" fill="#f59e0b"/><text x="520" text-anchor="start" font-size="12.5" font-weight="500" fill="#172b3a"><tspan x="520" y="120.4">Gantt: capas Avance real, Marca Activity,</tspan></text> <circle style="display:none" cx="506" cy="142" r="4" fill="none"/><text x="520" text-anchor="start" font-size="12.5" font-weight="500" fill="#172b3a"><tspan x="520" y="150.4">Fecha de estado y Ruta crítica</tspan></text> <circle cx="506" cy="172" r="4" fill="#f59e0b"/><text x="520" text-anchor="start" font-size="12.5" font-weight="500" fill="#172b3a"><tspan x="520" y="180.4">Gantt: columnas agregadas con clic derecho</tspan></text> <circle cx="506" cy="202" r="4" fill="#f59e0b"/><text x="520" text-anchor="start" font-size="12.5" font-weight="500" fill="#172b3a"><tspan x="520" y="210.4">Gantt: filtros por columna</tspan></text> <circle cx="506" cy="232" r="4" fill="#f59e0b"/><text x="520" text-anchor="start" font-size="12.5" font-weight="500" fill="#172b3a"><tspan x="520" y="240.4">Preferencias de Configuración (son del navegador)</tspan></text> <circle cx="506" cy="262" r="4" fill="#f59e0b"/><text x="520" text-anchor="start" font-size="12.5" font-weight="500" fill="#172b3a"><tspan x="520" y="270.4">Columnas de mapeo personalizadas de XML</tspan></text> <text x="470" text-anchor="middle" font-size="12" font-weight="500" fill="#5a6b78"><tspan x="470" y="344.2">Compartir genera un HTML autónomo (OpenGanttLab_compartir.html): se abre sin el Excel ni el XML originales.</tspan></text>
</svg>
