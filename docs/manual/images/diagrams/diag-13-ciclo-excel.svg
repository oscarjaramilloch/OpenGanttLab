<text x="470" text-anchor="middle" font-size="13" font-weight="700" fill="#0f5132"><tspan x="470" y="172.6">Guardar cambios</tspan></text>
<text x="470" text-anchor="middle" font-size="11" font-weight="500" fill="#5a6b78"><tspan x="470" y="205.8">escribe la Tabla de Datos en el mismo archivo</tspan></text>
