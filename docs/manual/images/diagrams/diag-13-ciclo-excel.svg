<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',Arial,sans-serif">
<title id="t">Ciclo con Excel</title><desc id="d">Actualizar carga el Excel, Guardar cambios lo escribe; Descargar y Compartir generan archivos nuevos.</desc>
<defs>
