<text x="470" text-anchor="end" font-size="12" font-weight="600" fill="#172b3a"><tspan x="470" y="266.2">Descargar .xlsx · Compartir (HTML autónomo)</tspan></text>
<text x="470" text-anchor="middle" font-size="11" font-weight="500" fill="#5a6b78"><tspan x="470" y="291.9">Guardar en el Excel requiere Chrome o Edge (API File System Access).</tspan></text>
