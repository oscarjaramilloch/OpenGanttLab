<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#2563eb"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d0d0d0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="1.4"/></pattern>
</defs>
<rect x=".5" y=".5" width="939" height="299" rx="14" fill="#fff" stroke="#dde5ee"/>
<text x="470" text-anchor="middle" font-size="17" font-weight="700" fill="#0f2d5b"><tspan x="470" y="38.0">Ciclo de trabajo con un Excel vinculado</tspan></text>
<rect x="50" y="100" width="220" height="110" rx="14" fill="#ecfdf3" stroke="#16a34a" stroke-width="1.5"/><text x="160" text-anchor="middle" font-size="15" font-weight="600" fill="#0f5132"><tspan x="160" y="150.9">Excel vinculado</tspan><tspan x="160" y="169.6">Escenarios.xlsx</tspan></text>
<rect x="670" y="100" width="220" height="110" rx="14" fill="#e8f0ff" stroke="#2563eb" stroke-width="1.5"/><text x="780" text-anchor="middle" font-size="15" font-weight="600" fill="#0f2d5b"><tspan x="780" y="150.9">OpenGanttLab</tspan><tspan x="780" y="169.6">Gantt · LdT · Tabla</tspan></text>
<path d="M272 130 H668" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
<text x="470" text-anchor="middle" font-size="13" font-weight="700" fill="#0f2d5b"><tspan x="470" y="120.5">Actualizar</tspan></text>
<text x="470" text-anchor="middle" font-size="11" font-weight="500" fill="#5a6b78"><tspan x="470" y="153.8">recarga los últimos cambios del Excel</tspan></text>
