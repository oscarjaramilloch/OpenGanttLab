<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" width="940" height="240" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',Arial,sans-serif">
<title id="t">Conflicto de fechas</title><desc id="d">B empieza antes de que termine su predecesora A en un vínculo FC.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5a6b78"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#2563eb"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d0d0d0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="1.4"/></pattern>
</defs>
<rect x=".5" y=".5" width="939" height="239" rx="14" fill="#fff" stroke="#dde5ee"/>
<text x="470" text-anchor="middle" font-size="17" font-weight="700" fill="#0f2d5b"><tspan x="470" y="38.0">Qué es un conflicto de fechas</tspan></text>
<text x="30" text-anchor="start" font-size="13" font-weight="700" fill="#0f2d5b"><tspan x="30" y="88.5">A</tspan></text>
<rect x="70" y="72" width="360" height="22" rx="4" fill="#2563eb"/>
<text x="30" text-anchor="start" font-size="13" font-weight="700" fill="#0f5132"><tspan x="30" y="136.6">B</tspan></text>
<rect x="240" y="120" width="330" height="22" rx="4" fill="#16a34a" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 3"/>
<path d="M430 94 h14 v14 h-214 v12" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 3" marker-end="url(#ah)"/>
<line x1="430" y1="60" x2="430" y2="160" stroke="#d63031" stroke-dasharray="3 3"/>
<text x="430" text-anchor="middle" font-size="11" font-weight="600" fill="#d63031"><tspan x="430" y="179.8">fin de A</tspan></text>
<text x="240" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309"><tspan x="240" y="179.8">inicio de B</tspan></text>
<rect x="610" y="70" width="300" height="80" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="760" text-anchor="middle" font-size="12" font-weight="600" fill="#7a4a00"><tspan x="760" y="99.2">Vínculo FC: B no puede empezar</tspan><tspan x="760" y="114.2">antes de que termine A.</tspan><tspan x="760" y="129.2">Aquí empieza antes → aviso.</tspan></text>
<text x="470" text-anchor="middle" font-size="12" font-weight="500" fill="#5a6b78"><tspan x="470" y="218.2">Puede ser intencional (por estrategia): el aviso es opcional y viene apagado (Configuración).</tspan></text>
</svg>
