<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 200" width="940" height="200" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',Arial,sans-serif">
<title id="t">Flujo de trabajo</title><desc id="d">Importar, revisar, comparar, presentar y exportar.</desc>
<defs>
