<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#2563eb"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d0d0d0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="1.4"/></pattern>
</defs>
<rect x=".5" y=".5" width="939" height="199" rx="14" fill="#fff" stroke="#dde5ee"/>
<text x="470" text-anchor="middle" font-size="17" font-weight="700" fill="#0f2d5b"><tspan x="470" y="38.0">Flujo de trabajo en OpenGanttLab</tspan></text><path d="M24 70 h154 l18 40 l-18 40 h-154 l18 -40 z" fill="#0f2d5b"/><text x="114" text-anchor="middle" font-size="15" font-weight="800" fill="#fff"><tspan x="114" y="105.3">IMPORTAR</tspan></text><text x="114" text-anchor="middle" font-size="11" font-weight="500" fill="#dbe7ff"><tspan x="114" y="125.8">Datos → Cargar archivo</tspan></text><circle cx="46" cy="62" r="13" fill="#f59e0b"/><text x="46" text-anchor="middle" font-size="13" font-weight="700" fill="#fff"><tspan x="46" y="66.5">1</tspan></text>
<path d="M208 70 h154 l18 40 l-18 40 h-154 l18 -40 z" fill="#2563eb"/><text x="298" text-anchor="middle" font-size="15" font-weight="800" fill="#fff"><tspan x="298" y="105.3">REVISAR</tspan></text><text x="298" text-anchor="middle" font-size="11" font-weight="500" fill="#dbe7ff"><tspan x="298" y="125.8">Tabla de Datos</tspan></text><circle cx="230" cy="62" r="13" fill="#f59e0b"/><text x="230" text-anchor="middle" font-size="13" font-weight="700" fill="#fff"><tspan x="230" y="66.5">2</tspan></text>
<path d="M392 70 h154 l18 40 l-18 40 h-154 l18 -40 z" fill="#0f2d5b"/><text x="482" text-anchor="middle" font-size="15" font-weight="800" fill="#fff"><tspan x="482" y="105.3">COMPARAR</tspan></text><text x="482" text-anchor="middle" font-size="11" font-weight="500" fill="#dbe7ff"><tspan x="482" y="125.8">Gantt · Línea base</tspan></text><circle cx="414" cy="62" r="13" fill="#f59e0b"/><text x="414" text-anchor="middle" font-size="13" font-weight="700" fill="#fff"><tspan x="414" y="66.5">3</tspan></text>
<path d="M576 70 h154 l18 40 l-18 40 h-154 l18 -40 z" fill="#2563eb"/><text x="666" text-anchor="middle" font-size="15" font-weight="800" fill="#fff"><tspan x="666" y="105.3">PRESENTAR</tspan></text><text x="666" text-anchor="middle" font-size="11" font-weight="500" fill="#dbe7ff"><tspan x="666" y="125.8">Línea de Tiempo</tspan></text><circle cx="598" cy="62" r="13" fill="#f59e0b"/><text x="598" text-anchor="middle" font-size="13" font-weight="700" fill="#fff"><tspan x="598" y="66.5">4</tspan></text>
<path d="M760 70 h154 l18 40 l-18 40 h-154 l18 -40 z" fill="#16a34a"/><text x="850" text-anchor="middle" font-size="15" font-weight="800" fill="#fff"><tspan x="850" y="105.3">EXPORTAR</tspan></text><text x="850" text-anchor="middle" font-size="11" font-weight="500" fill="#dbe7ff"><tspan x="850" y="125.8">PNG · PDF · PPTX · HTML</tspan></text><circle cx="782" cy="62" r="13" fill="#f59e0b"/><text x="782" text-anchor="middle" font-size="13" font-weight="700" fill="#fff"><tspan x="782" y="66.5">5</tspan></text><text x="470" text-anchor="middle" font-size="12" font-weight="500" fill="#5a6b78"><tspan x="470" y="182.2">Cada etapa se puede repetir: al corregir un dato, el Gantt y la Línea de Tiempo se actualizan.</tspan></text>
