<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',Arial,sans-serif">
<title id="t">Lectura de un XML</title><desc id="d">El XML se lee por partes: se conservan proyecto, tareas, líneas base y predecesoras; se descartan asignaciones, recursos, calendarios y time phasing.</desc>
<defs>
