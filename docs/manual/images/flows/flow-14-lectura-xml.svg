<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d0d0d0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="1.4"/></pattern>
</defs>
<rect x=".5" y=".5" width="939" height="329" rx="14" fill="#fff" stroke="#dde5ee"/>
<text x="470" text-anchor="middle" font-size="17" font-weight="700" fill="#0f2d5b"><tspan x="470" y="38.0">Cómo se lee un archivo XML de Project</tspan></text>
<rect x="24" y="120" width="150" height="70" rx="10" fill="#fff7e6" stroke="#f59e0b" stroke-width="1.5"/><text x="99" text-anchor="middle" font-size="13" font-weight="600" fill="#7a4a00"><tspan x="99" y="151.4">Archivo .xml</tspan><tspan x="99" y="167.7">hasta más de 1 GB</tspan></text>
<line x1="176" y1="155" x2="214" y2="155" stroke="#5a6b78" stroke-width="2" marker-end="url(#ah)"/>
